<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test</title>
</head>
<body>
    <h1>Authentication Test</h1>
    
    <div>
        <h2>Login Test</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" value="test@example.com" required><br>
            <input type="password" id="password" placeholder="Password" value="TestPass123" required><br>
            <button type="submit">Login</button>
        </form>
        <div id="loginResult"></div>
    </div>

    <div>
        <h2>Load User Test</h2>
        <button onclick="loadUser()">Load User</button>
        <div id="loadUserResult"></div>
    </div>

    <script>
        let authToken = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    authToken = data.token;
                    document.getElementById('loginResult').innerHTML = `
                        <p style="color: green;">✅ Login successful!</p>
                        <p>Token: ${data.token.substring(0, 50)}...</p>
                        <p>User: ${data.user.name} (${data.user.email})</p>
                    `;
                } else {
                    document.getElementById('loginResult').innerHTML = `
                        <p style="color: red;">❌ Login failed: ${data.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('loginResult').innerHTML = `
                    <p style="color: red;">❌ Error: ${error.message}</p>
                `;
            }
        });

        async function loadUser() {
            if (!authToken) {
                document.getElementById('loadUserResult').innerHTML = `
                    <p style="color: red;">❌ No token available. Please login first.</p>
                `;
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/me', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                
                const data = await response.json();
                console.log('Load user response:', data);
                
                if (data.success !== undefined) {
                    document.getElementById('loadUserResult').innerHTML = `
                        <p style="color: green;">✅ User loaded successfully!</p>
                        <p>User: ${data.name} (${data.email})</p>
                        <p>Role: ${data.role}</p>
                    `;
                } else {
                    document.getElementById('loadUserResult').innerHTML = `
                        <p style="color: red;">❌ Failed to load user: ${data.message}</p>
                    `;
                }
            } catch (error) {
                console.error('Load user error:', error);
                document.getElementById('loadUserResult').innerHTML = `
                    <p style="color: red;">❌ Error: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
